services:
  postgres:
    image: postgres:16-alpine
    container_name: chicken_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chickenwholesale}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chickenwholesale}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chicken_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:-Host=postgres;Port=5432;Database=chickenwholesale;Username=postgres;Password=postgres}
      Jwt__Key: ${JWT_KEY:-dev-only-super-secret-key-change-me-please-1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-ChickenWholesaleApi}
      Jwt__Audience: ${JWT_AUDIENCE:-ChickenWholesaleClient}
      Jwt__ExpiryHours: ${JWT_EXPIRY_HOURS:-12}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: chicken_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  postgres_data:
